name: Daily Stock and News Collection

on:
  schedule:
    - cron: '0 18 * * 1-5'  # 20h FR (18h UTC) du lundi au vendredi
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: |
          pip install yfinance pandas numpy requests

      - name: Run Stock Pipeline
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: python stock_pipeline.py

      - name: Run News Collection (simplifié)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python sentiment_analysis.py

      - name: List generated files
        run: |
          echo "=== Fichiers générés ==="
          find . -name "*.csv" -type f | sort
          echo ""
          echo "=== Taille des dossiers ==="
          du -sh data/ sentiment_data/ 2>/dev/null || echo "Dossiers non trouvés"
