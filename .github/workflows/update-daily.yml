name: Daily Stock and News Collection

on:
  schedule:
    - cron: '0 18 * * 1-5'  # 20h FR (18h UTC) du lundi au vendredi
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy requests
          pip install transformers torch scikit-learn

      - name: Run Financial Data Pipeline (yFinance)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: python data_pipeline.py

      - name: Run Sentiment Analysis (NewsAPI)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python sentiment_analysis.py

      - name: Verify generated files
        run: |
          echo "=== Generated CSV files ==="
          find . -name "*.csv" -type f | sort
          
          echo ""
          echo "=== Data folder ==="
          ls -la data/
          
          echo ""
          echo "=== Sentiment folder ==="
          ls -la sentiment_data/
