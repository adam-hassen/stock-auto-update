name: Mise a jour quotidienne des prix et analyse de sentiment

on:
  schedule:
    - cron: '0 18 * * 1-5'  # 20h FR (18h UTC) du lundi au vendredi
  workflow_dispatch:

jobs:
  run-all-scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies stock_pipeline
        run: pip install yfinance pandas numpy

      - name: Run Stock Pipeline
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: python stock_pipeline.py

      - name: Nettoyer avant installation transformers
        run: |
          # Nettoyer le cache pip
          pip cache purge
          # Nettoyer les fichiers temporaires
          sudo rm -rf /tmp/* /var/tmp/*
          
      - name: Install transformers light (sans torch)
        run: |
          # Installation légère de transformers
          pip install transformers --no-deps
          pip install sentencepiece tokenizers huggingface-hub requests pandas
          
      - name: Run Sentiment Analysis (mode CPU)
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: |
          # Forcer l'utilisation CPU pour éviter d'installer torch
          python -c "
import os
os.environ['TF_CPP_MIN_LOG_LEVEL'] = '3'
os.environ['CUDA_VISIBLE_DEVICES'] = '-1'
print('Mode CPU activé')
"

          # Lancer l'analyse
          python sentiment_analysis.py

      - name: Verifier les fichiers generes
        run: |
          echo "Fichiers generes:"
          find . -name "*.csv" -type f | head -10
          ls -la data/ 2>/dev/null || echo "Pas de dossier data"
          ls -la sentiment_data/ 2>/dev/null || echo "Pas de dossier sentiment_data"
