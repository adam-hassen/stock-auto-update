name: Run Analysis

on:
  schedule:
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        pip install yfinance pandas numpy requests torch transformers
    
    - name: Run scripts
      run: |
        # Run stock data
        python data_pipeline.py
        
        # Run sentiment with forced keys
        NEWSAPI_KEY="ed172154b55e4d4eb95db4ac7895b29e" \
        GNEWS_API_KEY="7fd1230f54a4be2030c483514e145263" \
        PUSH_TOKEN="${{ secrets.PUSH_TOKEN }}" \
        python sentiment_analysis.py
    
    - name: Show results
      run: |
        echo "Files created:"
        ls *.csv 2>/dev/null || echo "No CSV files"
        ls data/*.csv 2>/dev/null || echo "No data files"
