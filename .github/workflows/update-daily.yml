name: Stock Analysis

on:
  schedule:
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install packages
      run: |
        pip install yfinance pandas numpy requests
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install transformers
    
    - name: Run data pipeline
      run: python data_pipeline.py
    
    - name: Run sentiment analysis
      run: |
        export NEWSAPI_KEY="ed172154b55e4d4eb95db4ac7895b29e"
        export GNEWS_API_KEY="7fd1230f54a4be2030c483514e145263"
        python sentiment_analysis.py
    
    - name: Push to current repo
      env:
        GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        
        # Créer dossier pour les articles
        mkdir -p sentiment_articles
        cp articles_*.csv sentiment_articles/ 2>/dev/null || true
        
        # Ajouter tous les fichiers générés
        git add data/ sentiment_articles/ articles_*.csv ALL_ARTICLES_*.csv 2>/dev/null || true
        
        # Commit si changements
        if ! git diff --cached --quiet; then
          git commit -m "Update analysis - $(date +'%Y-%m-%d %H:%M')"
          git push
        else
          echo "No changes to commit"
        fi
