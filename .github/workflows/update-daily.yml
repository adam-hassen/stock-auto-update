name: Stock Analysis Daily

on:
  schedule:
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
      # ===================== CHECKOUT =====================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      # ===================== PYTHON =====================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy scipy
          pip install huggingface_hub
          pip install transformers torch requests

      # ===================== GIT CONFIG =====================
      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # ===================== COLLECTE FINANCIERE =====================
      - name: Run Financial Data Collection
        run: python data_pipeline.py

      # ===================== COLLECTE SENTIMENT =====================
      - name: Run Sentiment Analysis
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: python sentiment_analysis.py

      # ===================== PUSH REPO PERSO =====================
      - name: Commit and push to personal repository
        run: |
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Daily financial data update $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi

      # ===================== PUSH REPO PROJET =====================
      - name: Push data to project repository
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          git clone https://x-access-token:${PUSH_TOKEN}@github.com/Gasthorn/Projet4A_PredictionsBoursieres.git project_repo
          cd project_repo
          git checkout Collecte-Des-Données
          mkdir -p data
          cp -r ../data/*.csv data/
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Aucun changement repo projet"
          else
            git commit -m "MAJ donnees financieres $(date +'%Y-%m-%d %H:%M')"
            git push origin Collecte-Des-Données
          fi

      # ===================== PUSH HUGGING FACE (PERSO + COMMUN) =====================
      - name: Upload datasets to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<EOF
          from huggingface_hub import login, HfApi
          import os
          login(token=os.environ["HF_TOKEN"])
          api = HfApi()
          datasets = [
              "adam5858/stock-market-data",
              "Projet4AIABoursiere/stock-market-data"
          ]
          for repo_id in datasets:
              for file in os.listdir("data"):
                  if file.endswith(".csv"):
                      api.upload_file(
                          path_or_fileobj=f"data/{file}",
                          path_in_repo=file,
                          repo_id=repo_id,
                          repo_type="dataset"
                      )
                  # Upload aussi articles_sentiment si dossier existe
                  sentiment_dir = "data/articles_sentiment"
                  if os.path.exists(sentiment_dir):
                      for sfile in os.listdir(sentiment_dir):
                          if sfile.endswith(".csv"):
                              api.upload_file(
                                  path_or_fileobj=f"{sentiment_dir}/{sfile}",
                                  path_in_repo=f"articles_sentiment/{sfile}",
                                  repo_id=repo_id,
                                  repo_type="dataset"
                              )
              print(f"Dataset mis a jour : {repo_id}")
          EOF
