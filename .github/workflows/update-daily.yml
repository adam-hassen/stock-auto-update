name: Stock Analysis with Push

on:
  schedule:
    - cron: '0 18 * * 1-5'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install
      run: |
        pip install yfinance pandas numpy requests
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install transformers
    
    - name: Run data pipeline
      run: python data_pipeline.py
    
    - name: Run sentiment
      run: |
        export NEWSAPI_KEY="ed172154b55e4d4eb95db4ac7895b29e"
        export GNEWS_API_KEY="7fd1230f54a4be2030c483514e145263"
        python sentiment_analysis.py
    
    - name: Push to GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
      run: |
        if [ -n "$GITHUB_TOKEN" ]; then
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          mkdir -p sentiment_articles
          cp articles_*.csv sentiment_articles/ 2>/dev/null || true
          git add data/ sentiment_articles/
          if ! git diff --cached --quiet; then
            git commit -m "Update $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
        else
          echo "Pas de token, skip push"
        fi
